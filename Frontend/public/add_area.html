<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agregar Área</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { background-color: #f0f2f5; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card-header { background: linear-gradient(135deg, #1a73e8, #0d47a1); border-radius: 12px 12px 0 0 !important; }
    .btn-primary { background: linear-gradient(135deg, #1a73e8, #0d47a1); border: none; }
    .btn-primary:hover { opacity: 0.9; }
    .form-label { font-weight: 500; color: #444; }
    .form-control:focus { border-color: #1a73e8; box-shadow: 0 0 0 0.2rem rgba(26,115,232,0.15); }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card">
          <div class="card-header py-3 text-white">
            <h4 class="mb-0"><i class="bi bi-diagram-3 me-2"></i>Agregar Área</h4>
          </div>
          <div class="card-body p-4">
            <form id="add-area-form">
              <div class="row g-3">
                <div class="col-12">
                  <label for="nombre" class="form-label">Nombre del Área</label>
                  <input type="text" class="form-control" id="nombre" placeholder="Ingrese nombre del área"/>
                </div>
              </div>

              <div id="error-message" class="alert alert-danger mt-3 d-none"></div>

              <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4">
                  <i class="bi bi-plus-circle me-2"></i>Agregar Área
                </button>
                <a href="#" class="btn btn-outline-secondary px-4">
                  <i class="bi bi-arrow-left me-2"></i>Volver
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./js/add_area.js"></script>
</body>
</html>
