<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agregar Empleado</title>
  <link rel="stylesheet" href="./css/add_empleados.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { background-color: #f0f2f5; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card-header { background: linear-gradient(135deg, #1a73e8, #0d47a1); border-radius: 12px 12px 0 0 !important; }
    .btn-primary { background: linear-gradient(135deg, #1a73e8, #0d47a1); border: none; }
    .btn-primary:hover { opacity: 0.9; }
    .form-label { font-weight: 500; color: #444; }
    .form-control:focus, .form-select:focus { border-color: #1a73e8; box-shadow: 0 0 0 0.2rem rgba(26,115,232,0.15); }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9">
        <div class="card">
          <div class="card-header py-3 text-white">
            <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Agregar Nuevo Empleado</h4>
          </div>
          <div class="card-body p-4">
            <form id="add-empleado-form">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="nombre" class="form-label">Nombre</label>
                  <input type="text" class="form-control" id="nombre" placeholder="Ingrese nombre" required/>
                </div>
                <div class="col-md-6">
                  <label for="apellido" class="form-label">Apellido</label>
                  <input type="text" class="form-control" id="apellido" placeholder="Ingrese apellido" required/>
                </div>
                <div class="col-12">
                  <label for="direccion" class="form-label">Dirección</label>
                  <input type="text" class="form-control" id="direccion" placeholder="Ingrese dirección" required/>
                </div>
                <div class="col-md-6">
                  <label for="pais" class="form-label">País</label>
                  <select class="form-select" id="pais" required>
                    <option value="" disabled selected>Seleccione un país</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input type="text" class="form-control" id="telefono" placeholder="Ingrese teléfono" required/>
                </div>
                <div class="col-12">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required/>
                </div>
                <div class="col-md-6">
                  <label for="area" class="form-label">Área</label>
                  <select class="form-select" id="area" required>
                    <option value="" disabled selected>Seleccione un área</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="salario" class="form-label">Salario</label>
                  <div class="input-group">
                    <span class="input-group-text">₲</span>
                    <input type="number" class="form-control" id="salario" step="0.01" placeholder="0.00"/>
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="fecha_ingreso" class="form-label">Fecha de Ingreso</label>
                  <input type="date" class="form-control" id="fecha_ingreso" required/>
                </div>
                <div class="col-md-6">
                  <label for="fecha_salida" class="form-label">Fecha de Salida <span class="text-muted fw-normal">(opcional)</span></label>
                  <input type="date" class="form-control" id="fecha_salida"/>
                </div>
              </div>

              <div id="error-message" class="alert alert-danger mt-3 d-none"></div>

              <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4">
                  <i class="bi bi-plus-circle me-2"></i>Agregar Empleado
                </button>
                <a href="#" class="btn btn-outline-secondary px-4">
                  <i class="bi bi-arrow-left me-2"></i>Volver
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./js/add_empleado.js"></script>
</body>
</html>
